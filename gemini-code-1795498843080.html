    .page-header p {

    }
    #filter-bar {
      display: flex;

      margin-bottom: 3.5rem;

    #filter-bar .btn {

<body>

  <!-- Header & Navigation -->
  <header>
    <div class="nav-wrapper">
      <a href="index.html" class="brand-logo">my mint</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="product.html">สินค้า</a></li>
